<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" role="img" aria-label="작은 골퍼가 공을 치고 공을 따라 달려가는 애니메이션">
<style>
.analysis-golf-scene .runner,.analysis-golf-scene .ball,.analysis-golf-scene .swing,.analysis-golf-scene .leg,.analysis-golf-scene .bob{animation-duration:7s;animation-iteration-count:infinite;animation-timing-function:linear;animation-play-state:paused}.analysis-golf-scene .runner{animation-name:mg-loading-chase}.analysis-golf-scene .ball{animation-name:mg-loading-flight}.analysis-golf-scene .swing{transform-origin:70px 100px;animation-name:mg-loading-swing}.analysis-golf-scene .leg{transform-box:fill-box;transform-origin:top center}.analysis-golf-scene .leg.a{animation-name:mg-loading-run-a}.analysis-golf-scene .leg.b{animation-name:mg-loading-run-b}.analysis-golf-scene .bob{animation-name:mg-loading-bob}
@keyframes mg-loading-swing{0%,8%{transform:rotate(0)}16%{transform:rotate(-105deg)}24%{transform:rotate(65deg)}32%,100%{transform:rotate(0)}}
@keyframes mg-loading-flight{0%,22%{transform:translate(0,0);opacity:1}31%{transform:translate(90px,-80px);opacity:1}42%,85%{transform:translate(215px,-4px);opacity:1}91%,100%{transform:translate(215px,-4px);opacity:0}}
@keyframes mg-loading-chase{0%,40%{transform:translateX(0);opacity:1}85%{transform:translateX(208px);opacity:1}91%{transform:translateX(215px);opacity:0}92%,100%{transform:translateX(0);opacity:0}}
@keyframes mg-loading-run-a{0%,40%,85%,100%{transform:rotate(0)}44%,54%,64%,74%,84%{transform:rotate(-28deg)}49%,59%,69%,79%{transform:rotate(28deg)}}
@keyframes mg-loading-run-b{0%,40%,85%,100%{transform:rotate(0)}44%,54%,64%,74%,84%{transform:rotate(28deg)}49%,59%,69%,79%{transform:rotate(-28deg)}}
@keyframes mg-loading-bob{0%,40%,85%,100%{transform:translateY(0)}45%,55%,65%,75%{transform:translateY(-4px)}50%,60%,70%,80%{transform:translateY(0)}}

</style>
<defs><linearGradient id="golf-sky" x2="0" y2="1"><stop stop-color="#f0f8f4"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>
<rect width="360" height="180" rx="24" fill="url(#golf-sky)"/>
<circle cx="293" cy="36" r="15" fill="#f3da8c"/>
<path d="M0 132Q70 101 135 127T270 121T360 127V180H0Z" fill="#dcecdf"/>
<path d="M0 150Q90 131 180 149T360 140V180H0Z" fill="#c3dfca"/>
