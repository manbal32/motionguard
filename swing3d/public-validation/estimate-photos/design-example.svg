<svg xmlns="http://www.w3.org/2000/svg" width="360" height="626"><rect width="360" height="626" fill="#eff6f1"/><g font-family="Noto Sans CJK KR,sans-serif"><text x="16" y="20" font-size="12" font-weight="500" fill="#28573c">배치 예시 · 실제 브라우저 캡처 아님</text><text x="16" y="37" font-size="11" font-weight="500" fill="#28573c">사진 영역은 테스트 표시이며 실제 분석 사진이 아님</text><rect x="16" y="48" width="328" height="242" rx="14" fill="#fff" stroke="#cbded1"/><text x="32" y="78" font-size="16" font-weight="700" fill="#28573c">사진과 상담으로 예상한 타수</text><rect x="32" y="96" width="54" height="78" rx="8" fill="#e4eee7" stroke="#cbded1"/><path d="M47 120h24v24h-24Z M47 139l8-8 6 6 4-4 6 6" fill="none" stroke="#7e9d88" stroke-width="1.5"/><text x="38" y="165" font-size="12" font-weight="500" fill="#28573c">사진 1</text><text x="37" y="194" font-size="14" font-weight="500" fill="#28573c">0.5초</text><rect x="92" y="96" width="54" height="78" rx="8" fill="#e4eee7" stroke="#cbded1"/><path d="M107 120h24v24h-24Z M107 139l8-8 6 6 4-4 6 6" fill="none" stroke="#7e9d88" stroke-width="1.5"/><text x="98" y="165" font-size="12" font-weight="500" fill="#28573c">사진 2</text><text x="97" y="194" font-size="14" font-weight="500" fill="#28573c">1초</text><rect x="152" y="96" width="54" height="78" rx="8" fill="#e4eee7" stroke="#cbded1"/><path d="M167 120h24v24h-24Z M167 139l8-8 6 6 4-4 6 6" fill="none" stroke="#7e9d88" stroke-width="1.5"/><text x="158" y="165" font-size="12" font-weight="500" fill="#28573c">사진 3</text><text x="157" y="194" font-size="14" font-weight="500" fill="#28573c">1.5초</text><rect x="212" y="96" width="54" height="78" rx="8" fill="#e4eee7" stroke="#cbded1"/><path d="M227 120h24v24h-24Z M227 139l8-8 6 6 4-4 6 6" fill="none" stroke="#7e9d88" stroke-width="1.5"/><text x="218" y="165" font-size="12" font-weight="500" fill="#28573c">사진 4</text><text x="217" y="194" font-size="14" font-weight="500" fill="#28573c">2초</text><rect x="272" y="96" width="54" height="78" rx="8" fill="#e4eee7" stroke="#cbded1"/><path d="M287 120h24v24h-24Z M287 139l8-8 6 6 4-4 6 6" fill="none" stroke="#7e9d88" stroke-width="1.5"/><text x="278" y="165" font-size="12" font-weight="500" fill="#28573c">사진 5</text><text x="277" y="194" font-size="14" font-weight="500" fill="#28573c">2.5초</text><path d="M32 210H328" stroke="#dce8df"/><text x="32" y="237" font-size="14" font-weight="500" fill="#28573c">사진과 상담을 바탕으로 예상한</text><text x="32" y="260" font-size="14" font-weight="500" fill="#28573c">18홀 타수예요.</text><text x="20" y="326" font-size="16" font-weight="700" fill="#28573c">예상 타수는 이렇게 봤어요</text><rect x="16" y="344" width="328" height="110" rx="14" fill="#fff" stroke="#cbded1"/><text x="32" y="372" font-size="16" font-weight="700" fill="#28573c">무엇을 보고 예상했나요?</text><text x="32" y="402" font-size="14" font-weight="500" fill="#28573c">스윙 사진과 상담한 고민을</text><text x="32" y="425" font-size="14" font-weight="500" fill="#28573c">함께 살펴봤어요.</text><rect x="16" y="470" width="328" height="110" rx="14" fill="#fff" stroke="#cbded1"/><text x="32" y="498" font-size="16" font-weight="700" fill="#28573c">연습 후 목표는 어떤 뜻인가요?</text><text x="32" y="528" font-size="14" font-weight="500" fill="#28573c">제안된 연습이 스윙에 반영됐을 때의</text><text x="32" y="551" font-size="14" font-weight="500" fill="#28573c">예상 타수예요.</text></g></svg>