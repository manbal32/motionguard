<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MotionGuard Swing3D</title>
<link rel="stylesheet" href="style.css">
<main>
  <h1>MotionGuard Swing3D</h1>
  <p class="lead">골프 스윙 영상을 올리면 좌표를 뽑아 3D로 재생합니다. 30초 150MB 이하.</p>
  <label class="primary-input">스윙 영상 <input id="video" type="file" accept="video/mp4,video/quicktime,.mp4,.mov"></label>
  <details>
    <summary>이미 뽑아둔 좌표 CSV로 열기</summary>
    <label>좌표 CSV <input id="csv" type="file" accept=".csv,text/csv"></label>
  </details>
  <p role="status"></p>
  <div id="viewer"></div>
</main>
<script src="./vendor/three/three.min.js"></script>
<script type="importmap">
{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}
</script>
<script src="swing3d.js"></script>
<script>
  const videoInput = document.querySelector("#video");
  const csvInput = document.querySelector("#csv");
  const status = document.querySelector("[role=status]");
  const viewer = document.querySelector("#viewer");

  async function load(input, endpoint, type, busy) {
    const file = input.files[0];
    if (!file) return;
    videoInput.disabled = csvInput.disabled = true;
    Swing3D.dispose();
    status.textContent = busy;
    try {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "Content-Type": type },
        body: file,
      });
      const data = await response.json();
      if (data.ok === false) {
        status.textContent = "3D 재현이 어렵습니다 — " + data.reason;
        return;
      }
      if (!response.ok) throw new Error("트랙 요청에 실패했습니다.");
      if (!window.THREE) throw new Error("Three.js를 불러올 수 없습니다.");
      let findings;
      if (file.name === "golf1_export.csv") {
        const result = await fetch("/api/findings/golf1");
        const findingFile = await result.json();
        if (!result.ok) throw new Error("결함 파일 거부: " + findingFile.reason);
        const digest = await crypto.subtle.digest("SHA-256", await file.arrayBuffer());
        const hash = Array.from(new Uint8Array(digest), byte => byte.toString(16).padStart(2, "0")).join("");
        if (hash === result.headers.get("X-Swing3D-Source-SHA256")) findings = findingFile;
      }
      Swing3D.mount(viewer, data, { findings, reference: findings?.reference });
      status.textContent = file.name + " · 표본 " + data.meta.samples + "개";
    } catch (error) {
      status.textContent = error.message;
    } finally {
      videoInput.disabled = csvInput.disabled = false;
    }
  }

  videoInput.addEventListener("change", () =>
    load(videoInput, "/api/video", "video/mp4",
      "영상에서 자세를 추출하는 중입니다. 길이에 따라 10초에서 1분쯤 걸립니다."));
  csvInput.addEventListener("change", () =>
    load(csvInput, "/api/track", "text/csv", "트랙을 만드는 중입니다."));
</script>
</html>
